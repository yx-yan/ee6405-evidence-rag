[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evrag"
version = "0.1.0"
description = "Evidence-aware RAG: when should a RAG agent answer, retrieve again, or abstain? — EE6405 NLP group project"
requires-python = ">=3.10"
dependencies = ["pyyaml", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
