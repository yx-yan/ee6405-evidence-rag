# Shared, FROZEN experiment settings. Every method reads these — change only via a PR approved by the team.
seed: 42

retrieval:
  # MiniLM, as in the basic_rag v1 results; owner B to confirm (bge-base was chosen on 2026-11-04 for
  # MedQuAD, since removed). Changing it means re-running every retrieval route.
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 5
  context_k: 4                # passages passed to the generator, within generator.max_source_tokens
  cache_dir: models/retrieval
  backend: faiss

generator:
  # Shared answer generator (src/evrag/generator.py): BART-base fine-tuned on medical QA by D
  # (docs/generator.md). Every route calls it; only the evidence passed in differs.
  model_dir: models/generator/bart-base/best   # trained checkpoint (not in git); or set EVRAG_GENERATOR_DIR
  release:                    # where model_dir is downloaded from on first use (needs `gh auth login`)
    repo: yx-yan/ee6405-evidence-rag
    tag: generator-v1
    asset: bart-base-best.zip
    sha256: 42246b294b5f1f8649a2577c06b0805ce24112e902a9308856e8e7baf9fd8009
  max_source_tokens: 1024
  max_new_tokens: 200
  num_beams: 4
  no_repeat_ngram_size: 3

data:
  default: coronavirus        # dataset used when neither --dataset nor EVRAG_DATASET is given
  splits: [dev, test]         # tune thresholds / prompts on dev ONLY

# Evaluation sets by name (data/README.md). The three disease sets are evaluated on their eval/
# versions, which add unanswerable questions (python -m evrag.data.unanswerable). WikiDoc was seen
# in generator training, so it is kept only for the appendix (results/basic_v1).
datasets:
  coronavirus:
    corpus: data/processed/coronavirus/eval/corpus.jsonl
    dataset: data/processed/coronavirus/eval/dataset.csv
  cancer:
    corpus: data/processed/cancer/eval/corpus.jsonl
    dataset: data/processed/cancer/eval/dataset.csv
  neuro:
    corpus: data/processed/neuro/eval/corpus.jsonl
    dataset: data/processed/neuro/eval/dataset.csv
  wikidoc:
    corpus: data/processed/corpus.jsonl
    dataset: data/processed/dataset.csv
