# Shared, FROZEN experiment settings. Every method reads these — change only via a PR approved by the team.
seed: 42

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2   # TODO(B): confirm
  top_k: 5
  cache_dir: models/retrieval
  backend: faiss

llm:
  model: TODO                 # TODO(team): pick one accessible LLM in Week 1
  temperature: 0.0
  max_tokens: 256
  # Provider-neutral adapter for an OpenAI-compatible chat/completions endpoint.
  # Set LLM_BASE_URL and LLM_MODEL in .env after the team chooses a provider.
  base_url: null
  timeout_seconds: 30

data:
  dataset: data/processed/dataset.csv
  corpus: data/processed/corpus.jsonl
  splits: [dev, test]         # tune thresholds / prompts on dev ONLY
