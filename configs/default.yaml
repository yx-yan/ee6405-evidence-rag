# Shared, FROZEN experiment settings. Every method reads these — change only via a PR approved by the team.
seed: 42

retrieval:
  # Team decision 2026-11-04: bge-base replaces MiniLM (gold chunk in top 5 on MedQuAD dev A:
  # 44/45 vs 41/45, at rank 1: 36 vs 28; results/d_medquad_trial/embedding_comparison.json).
  embedding_model: BAAI/bge-base-en-v1.5
  top_k: 5
  cache_dir: models/retrieval
  backend: faiss

llm:
  model: TODO                 # TODO(team): pick one accessible LLM in Week 1
  temperature: 0.0
  max_tokens: 256
  # Provider-neutral adapter for an OpenAI-compatible chat/completions endpoint.
  # Set LLM_BASE_URL and LLM_MODEL in .env after the team chooses a provider.
  base_url: null
  timeout_seconds: 120        # a local model can take about 20 s to load on its first call

data:
  # Team decision 2026-11-04: MedQuAD knowledge base and A/B/C questions (data/medquad/README.md);
  # the MTS-Dialog export stays under data/processed for reference.
  dataset: data/medquad/dataset.csv
  corpus: data/medquad/corpus.jsonl
  splits: [dev, test]         # tune thresholds / prompts on dev ONLY
