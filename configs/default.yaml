# Shared, FROZEN experiment settings. Every method reads these — change only via a PR approved by the team.
seed: 42

retrieval:
  # Team decision 2026-11-04: bge-base replaces MiniLM (better gold-chunk recall in a MedQuAD trial,
  # since removed); re-check once the new dataset exists.
  embedding_model: BAAI/bge-base-en-v1.5
  top_k: 5
  cache_dir: models/retrieval
  backend: faiss

data:
  # TODO(team): the new medical dataset (e.g. heart disease) is being prepared; the general
  # datasets (MedQuAD, LiveQA-Med, Symptom2Disease, MTS-Dialog) were removed on 2026-11-08.
  dataset: TODO
  corpus: TODO
  splits: [dev, test]         # tune thresholds / prompts on dev ONLY
