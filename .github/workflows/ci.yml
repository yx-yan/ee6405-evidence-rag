name: EVRAG Metrics Evaluation Suite CI

on:
  push:
    branches: [ main, master, Illgetgood-patch-2 ]
  pull_request:
    branches: [ main, master, Illgetgood-patch-2 ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Runtime environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs packages needed for the experiment pipeline matrix
        pip install pytest numpy pandas pyyaml sentence-transformers rank_bm25
        # Install the local src directory as an editable package so 'import evrag' works perfectly
        pip install -e .

    - name: Run Hand-Checked Unit Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        python -m pytest tests/

    - name: Run Sample Evaluation Experiment
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        # Run a quick 20-sample dummy trial to verify experiment stability in the cloud
        python -m src.evrag.evaluation.run_experiment --method dummy --split dev --limit 20

    - name: Run Global Evaluation Matrix Verification
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        # Generates summary matrices dynamically inside the virtual environment
        python -m src.evrag.evaluation.metrics --split test
