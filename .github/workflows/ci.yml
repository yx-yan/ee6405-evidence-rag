name: EVRAG Metrics Evaluation Suite CI

on:
  push:
    # Explicitly including your active feature patch branch
    branches: [ main, master, Illgetgood-patch-2 ]
  pull_request:
    branches: [ main, master, Illgetgood-patch-2 ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Runtime environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest numpy pandas pyyaml

    - name: Run Hand-Checked Unit Tests
      run: |
        # Informs the runner how to locate your local source modules
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        python -m pytest tests/

    - name: Run Global Evaluation Matrix Verification
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        # Generates summary matrices dynamically inside the virtual environment
        python -m src.evrag.evaluation.metrics --split test
